<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Ink Master | Premium Sleeve Custom Tattooing</title>
    <style>
        :root {
            --bg-color: #070707;
            --surface-color: #111111;
            --surface-card: #181818;
            --accent-color: #c5a880; 
            --accent-glow: rgba(197, 168, 128, 0.15);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(7, 7, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        nav ul a {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul a:hover {
            color: var(--accent-color);
        }

        .nav-phone {
            background-color: var(--surface-color);
            border: 1px solid var(--accent-color);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            color: var(--accent-color) !important;
            font-weight: 700 !important;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .nav-phone:hover {
            background-color: var(--accent-color);
            color: #000 !important;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, #161616 0%, #070707 100%);
            margin-top: 60px;
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--accent-color);
            display: block;
            font-size: 5rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 650px;
            margin-bottom: 2.5rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.9rem 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            border: 1px solid var(--accent-color);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent-color);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
        }

        /* --- GENERAL STRUCTURE --- */
        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title span {
            color: var(--accent-color);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 4rem;
            font-size: 1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- DETAILED SERVICES SECTION --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .service-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .service-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
        }

        .image-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Temporary aesthetic placeholders before real images are hosted */
        .placeholder-text {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            position: absolute;
        }

        .service-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .service-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* --- BOOKING SYSTEM PANEL --- */
        .booking-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            background-color: var(--surface-card);
            padding: 3.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .calculator-box {
            border-left: 2px solid var(--accent-color);
            padding-left: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .calc-title {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .price-display {
            margin-top: 2rem;
            padding: 1.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            text-align: center;
            border-radius: 4px;
        }

        .price-display h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .price-amount {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* --- FOOTER --- */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 4rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #040404;
        }
        
        .footer-contacts {
            margin-bottom: 2rem;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3rem;
        }
