<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Ink Master | Premium Tattoo Studio</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #121212;
            --accent-color: #c5a880; 
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #262626;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        nav ul a {
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul a:hover {
            color: var(--accent-color);
        }

        .nav-phone {
            background-color: var(--surface-color);
            border: 1px solid var(--accent-color);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            color: var(--accent-color) !important;
            font-weight: 600 !important;
        }

        .nav-phone:hover {
            background-color: var(--accent-color);
            color: #000 !important;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            margin-top: 60px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--accent-color);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            border: 1px solid var(--accent-color);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent-color);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
        }

        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.25rem;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title span {
            color: var(--accent-color);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .portfolio-item {
            background-color: var(--surface-color);
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .portfolio-item::before {
            content: "Fine Line Work";
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .portfolio-item:nth-child(2)::before { content: "Geometric Sleeve"; }
        .portfolio-item:nth-child(3)::before { content: "Minimalist Flower"; }
        .portfolio-item:nth-child(4)::before { content: "Blackwork Script"; }
        .portfolio-item:nth-child(5)::before { content: "Micro Realism"; }
        .portfolio-item:nth-child(6)::before { content: "Custom Calligraphy"; }

        .portfolio-item:hover {
            border-color: var(--accent-color);
        }

        .booking-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            background-color: var(--surface-color);
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 900px) {
            .booking-container {
                grid-template-columns: 1fr;
                gap: 3rem;
                padding: 1.5rem;
            }
            .hero h1 { font-size: 2.5rem; }
            nav ul { display: none; }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .calculator-box {
            border-left: 2px solid var(--accent-color);
            padding-left: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .calc-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .price-display {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            text-align: center;
            border-radius: 4px;
        }

        .price-display h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .price-amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 3rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .footer-contacts {
            margin-bottom: 1.5rem;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }
        
        .footer-contacts a {
            color: var(--accent-color);
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .footer-contacts a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">Simple <span>Ink Master</span></div>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#portfolio">Portfolio</a></li>
                    <li><a href="#booking">Book Consultation</a></li>
                    <li><a href="https://wa.me" target="_blank" class="nav-phone">💬 WhatsApp</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <h1>Clean Lines. <br><span>Simple Ink Master.</span></h1>
        <p>Premium custom tattooing specialized in fine line precision, geometric minimalist concepts, and striking high-contrast blackwork.</p>
        <div class="cta-buttons">
            <a href="#booking" class="btn btn-primary">Book Session</a>
            <a href="tel:7589808" class="btn btn-secondary">📞 Call 7589808</a>
        </div>
    </section>
